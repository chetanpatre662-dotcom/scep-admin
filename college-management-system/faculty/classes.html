<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Classes · CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/faculty.css" />
  <link rel="stylesheet" href="../css/features.css" />
  <style>
    /* Google Classroom card grid — inlined so this page renders correctly even
       if an external stylesheet fails to load. */
    .classes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 24px;
      padding-bottom: 40px;
    }
    .classroom-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .classroom-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .classroom-card:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
    .card-header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      padding: 20px;
      min-height: 110px;
      position: relative;
    }
    .card-header .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.25);
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .card-header .status-badge.archived { background: rgba(0, 0, 0, 0.25); }
    .card-header .class-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: capitalize;
    }
    .card-header .class-subtitle {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
    }
    .card-body {
      padding: 16px 20px;
      flex-grow: 1;
      background: #ffffff;
    }
    .student-count {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 500;
    }
    .student-count svg { width: 18px; height: 18px; flex-shrink: 0; }
    .card-footer {
      padding: 12px 20px;
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-delete {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      padding: 6px;
      border-radius: 6px;
      display: inline-flex;
      transition: color 0.15s, background 0.15s;
    }
    .btn-delete svg { width: 18px; height: 18px; }
    .btn-delete:hover {
      color: #ef4444;
      background: #fee2e2;
    }
    .btn-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4f46e5;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .btn-open:hover {
      background: #e0e7ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <script type="module" src="../js/faculty/classes.js"></script>
</body>
</html>
