<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Registration · College Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <section class="auth-hero">
      <div class="brand-row">
        <div class="logo-badge" id="logoBadge"></div>
        <div>
          <div class="brand-name" id="collegeName">College</div>
          <div class="brand-sub">Faculty Portal</div>
        </div>
      </div>
      <div class="hero-content">
        <h1>Create your faculty account.</h1>
        <p>Register to start managing classes, announcements and question papers.</p>
        <ul class="hero-points" id="heroPoints"></ul>
      </div>
      <div class="hero-foot" id="heroFoot"></div>
    </section>

    <section class="auth-form-panel">
      <div class="auth-card">
        <span class="role-pill" id="rolePill"></span>
        <h2>Create account</h2>
        <p class="auth-desc">It only takes a moment to get started.</p>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full name <span class="req">*</span></label>
            <input class="input" id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Dr. Anita Sharma" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email <span class="req">*</span></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="req">*</span></label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
              <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password"></button>
            </div>
            <div class="field-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm password <span class="req">*</span></label>
            <div class="input-group">
              <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" />
              <button type="button" class="toggle-visibility" id="toggleConfirm" aria-label="Show password"></button>
            </div>
            <div class="field-error"></div>
          </div>

          <!-- Role-specific profile fields are injected here by registerPage.js -->
          <div id="profileFields"></div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
        </form>

        <div class="auth-divider">or</div>
        <button type="button" class="btn-google" id="googleBtn"></button>

        <p class="auth-footer-link">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </section>
  </div>

  <script type="module">
    import { APP, ROLES, ROUTES } from '../js/config.js';
    import { icon, googleIcon } from '../js/common/icons.js';
    import { initRegisterPage } from '../js/common/registerPage.js';

    document.getElementById('logoBadge').innerHTML = icon('logo');
    document.getElementById('collegeName').textContent = APP.COLLEGE_SHORT;
    document.getElementById('rolePill').innerHTML = icon('user') + ' Faculty';
    document.getElementById('heroFoot').textContent = `${APP.COLLEGE_NAME} · ${APP.NAME}`;
    document.getElementById('googleBtn').innerHTML = googleIcon() + ' Continue with Google';
    document.getElementById('heroPoints').innerHTML = [
      'Manage classes across programs',
      'Publish targeted announcements',
      'Share previous question papers',
    ].map((t) => `<li>${icon('check')}<span>${t}</span></li>`).join('');

    initRegisterPage({ role: ROLES.FACULTY, dashboardUrl: ROUTES.FACULTY.DASHBOARD });
  </script>
</body>
</html>
